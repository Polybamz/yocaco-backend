# ============================================================
# ⚠️  IMPORTANT: Cloudflare Workers Compatibility
# ============================================================
# This backend uses Express, node-schedule, firebase-admin,
# mongoose, nodemailer and dotenv — all Node-runtime-only
# dependencies that are NOT compatible with Cloudflare Workers.
#
# OPTIONS TO DEPLOY THE BACKEND:
#
# 1. Cloudflare Pages Functions (recommended migration):
#    Rewrite the API using Hono (https://hono.dev) which is
#    Workers-native. Replace:
#      - Express routes      → Hono routes
#      - node-schedule       → Cloudflare Cron Triggers
#      - firebase-admin      → Firebase REST API or a separate Node service
#      - dotenv              → wrangler.toml [vars] / Cloudflare secrets
#    Then set main = "src/worker.js" and name = "yocaco-backend".
#
# 2. VPS / Railway / Render / Fly.io:
#    Deploy the Express app as-is on any Node.js host, then use
#    Cloudflare Tunnel or a custom domain to route traffic.
#
# 3. Cloudflare Tunnel:
#    Keep the backend on your own server and expose it via
#    cloudflared tunnel (no code changes needed).
#
# The config below is provided as a STARTING POINT for option 1.
# It will NOT work until the backend is migrated to a Workers-
# compatible framework.
# ============================================================

name = "yocaco-backend"
main = "worker_main.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (replaces .env when using Workers)
# Uncomment and set values via: wrangler secret put <KEY>
# or add them here as [vars] for non-secret values.
#
# [vars]
# CORS_ORIGINS = "https://career-quest-tiib-24.pages.dev,https://yocaco-tiib-hub.pages.dev"
#
# [secrets] — set via CLI:
#   wrangler secret put JWT_SECRET
#   wrangler secret put FIREBASE_PROJECT_ID
#   wrangler secret put FIREBASE_PRIVATE_KEY
#   wrangler secret put FIREBASE_CLIENT_EMAIL
#   wrangler secret put CLOUDINARY_CLOUD_NAME
#   wrangler secret put CLOUDINARY_API_KEY
#   wrangler secret put CLOUDINARY_API_SECRET
#   wrangler secret put FLW_PUBLIC_KEY
#   wrangler secret put FLW_SECRET_KEY
#   wrangler secret put FLW_SECRET_HASH